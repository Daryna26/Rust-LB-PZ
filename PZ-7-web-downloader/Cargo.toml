[package]
name = "web_downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
num_cpus = "1.16"
futures = "0.3"
url = "2.5"
